name: links

on:
  push:
    branches:
    - main
  pull_request:

# One run per branch/PR-head at a time: pushing to a branch with an open
# PR would otherwise run every job twice (push + pull_request events);
# a new run cancels the stale one.
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  link_checker:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7

    - uses: actions/setup-node@v7
      with:
        node-version: '22'
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    - name: Build with Astro
      run: npm run build

    - name: Link Checker
      id: lychee
      uses: lycheeverse/lychee-action@v2
      with:
        args: --root-dir dist/ --verbose --no-progress --max-concurrency 8 'dist/**/*.html'
        fail: false

name: build_deploy

on:
  push:
    branches:
    - main
  pull_request:
  # The benchmark workflow in tamatebako/tebako fires a bench-update dispatch
  # after appending to the bench-history branch; the rebuild picks up the new
  # latest/ dashboard files for the benchmarks page.
  repository_dispatch:
    types:
    - bench-update
  # Nightly rebuild: benchmark feeds and the versions catalog refresh without
  # waiting for a content commit.
  schedule:
  - cron: "23 4 * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v6
        with:
          enablement: true

      - name: Check (types and templates)
        run: npm run check

      - name: Test (registry invariants + prose lint)
        run: npm test

      - name: Build with Astro
        run: npm run build
        env:
          SITE_URL: https://www.tebako.org

      - name: Setup tebako (the dogfood toolchain)
        # The volume build proves the toolchain on ourselves: the packed
        # metanorma payload, installed from the official registry and
        # dispatched through the shim layer, compiles the spec set + the
        # composition calculus into the citable volume. The action caches
        # the ~/.tebako store, so steady-state builds pay no payload
        # download. The metanorma pin is NOT here — it lives in
        # book/book.yaml (SSOT) and the install step below reads it.
        uses: tamatebako/setup-tebako@v1
        with:
          version: 2.8.83
          registries: tfs:github:tebako-packages/registry

      - name: Restore the fontist cache
        # Font installs and the formulas repo clone are the slow part of a
        # cold volume build; the cache key tracks the book config (the
        # declared font set + toolchain pin).
        uses: actions/cache@v4
        with:
          path: ~/.fontist
          key: ${{ runner.os }}-fontist-book-${{ hashFiles('book/book.yaml') }}
          restore-keys: |
            ${{ runner.os }}-fontist-book-

      - name: Install the pinned metanorma payload
        # The pin is read from book/book.yaml — never duplicated in the
        # workflow. The ambient token gives the resolver's credentials
        # layer its authenticated tier (anonymous release-API enumeration
        # is the throttle class that reds cold installs).
        run: |
          pin=$(node --input-type=module -e "import YAML from 'yaml'; import { readFileSync } from 'node:fs'; process.stdout.write(YAML.parse(readFileSync('book/book.yaml','utf8')).toolchain.registry_version)")
          echo "metanorma pin from book/book.yaml: $pin"
          tebako install "metanorma@$pin"
        env:
          TEBAKO_GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Install fontconfig (the PDF leg's system-font floor)
        # mn2pdf's FOP passes need fontconfig plus at least one
        # fontconfig-visible font ("Fontconfig head is null" otherwise).
        # ubuntu-latest carries both; declared here so the dependency is
        # the workflow's, not the runner image's ambient state.
        run: sudo apt-get install -y fontconfig fonts-dejavu-core

      - name: Build the Tebako Volume
        run: npm run book
        env:
          TEBAKO_GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Graft the volume into dist/book
        run: |
          mkdir -p dist/book
          cp book/dist/index.html book/dist/tebako-volume.pdf book/dist/build-manifest.json dist/book/
          test -s dist/book/index.html && test -s dist/book/tebako-volume.pdf

      - name: Upload the volume artifacts
        # The same bytes that deploy serves at /book/, kept as a workflow
        # artifact so a publish's volume is inspectable without a redeploy.
        uses: actions/upload-artifact@v4
        with:
          name: tebako-volume
          path: book/dist/
          if-no-files-found: error

      - name: Assemble versions catalog (/versions)
        # Downloads the latest successful site-dist artifact from
        # tamatebako/versions and grafts it into dist/versions/. Cross-repo
        # artifact reads use the org-wide TEBAKO_CI_PAT_TOKEN (house
        # pattern: PAT || GITHUB_TOKEN — the default token has no rights
        # outside this repo). If the artifact read still fails, this step
        # degrades gracefully (continue-on-error) and the site deploys
        # without /versions.
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.TEBAKO_CI_PAT_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          RUN_ID=$(gh run list --repo tamatebako/versions --workflow build.yml --branch main --status success --limit 1 --json databaseId --jq '.[0].databaseId')
          if [ -z "$RUN_ID" ] || [ "$RUN_ID" = "null" ]; then
            echo "::warning::no successful site-dist run on tamatebako/versions — deploying without /versions"
            exit 0
          fi
          gh run download "$RUN_ID" --repo tamatebako/versions --name site-dist --dir dl/versions
          cp -R dl/versions/ dist/versions/
          test -f dist/index.html && test -f dist/versions/index.html

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./dist
          # Serve /.well-known/tebako-key.asc — the action's default
          # drops dot-paths from the archive, 404-ing the trust anchor's
          # second channel (only .git/.github stay excluded).
          include-hidden-files: true

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    if: ${{ github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

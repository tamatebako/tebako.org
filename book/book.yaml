# book/book.yaml — the Tebako Volume: metadata, spec sources, toolchain pins.
#
# This file is the authored configuration of the volume build
# (tools/build-book.mjs). The chapter list and reading order live in
# book/book.adoc (the entry point); this file carries everything else the
# build needs: what the volume is, where the spec chapters come from, and
# which toolchain builds them.
schema_version: 1

volume:
  title: The Tebako Volume
  # The series identity. The spec chapters keep their own TBK SPEC NN
  # numbers; the volume itself is TBK VOL 1.
  docnumber: TBK VOL 1
  publisher: The Tebako Project
  committee: Tebako
  committee_type: technical

# The spec chapters are the AsciiDoc twins of the normative Markdown specs:
# docs/spec-site/sources/ in tamatebako/tebako, regenerated from docs/spec/
# by that repo's own sync discipline (docs/spec-site/tools/sync.rb is the
# drift gate). This build CONSUMES the twins read-only — a stale twin is the
# sync gate's red, never this build's edit.
spec_sources:
  repo: tamatebako/tebako
  ref: main # BOOK_SPEC_REF overrides (any ref git ls-remote resolves; a 40-hex sha is used verbatim)
  path: docs/spec-site/sources
  # Architecture chapters come from this repository's own _docs/architecture/.
  architecture_dir: _docs/architecture

# The toolchain pin. The volume is built by the packed metanorma payload —
# never a floating "latest": the registry path installs exactly
# registry_version from the official registry, and the packed-release path
# downloads exactly packed_tag. The two pins name the same upstream
# metanorma-cli (registry 1.18.6 == packed-mn v1.18.6-*).
toolchain:
  registry_version: "1.18.6"
  packed_tag: v1.18.6-3

# The ribose flavor's fonts_manifest (metanorma-ribose's metanorma.yml) names
# nine families. They reach the compile two ways:
#
#   install — families the payload's own fontist dispatch resolves by name:
#     STIX Two Math (the `stix` formula's static OTF), Source Serif Pro and
#     Source Code Pro (the `source` formula's static TTFs). Installs run with
#     --confirm-license; a failed install is not fatal — the compile resolves
#     fonts itself and its own failure is the gate.
#
#   statics — the three google families, dropped byte-exact into
#     ~/.fontist/fonts/tebako-book/ from the pinned URLs, each verified
#     against its pinned sha256. fontist 3.0.11's by-name resolution always
#     selects the variable resource, whose name table registers only the base
#     family — the weight-named families the ribose manifest declares
#     (Open Sans Light, Open Sans Semibold, Noto Sans Mono Light) then never
#     resolve — and the whole-formula alternative dies upstream on a
#     sha-pinned moving archive. Static instances register their real
#     families and give the PDF leg real weights. A fetch or checksum
#     failure here is fatal: these files are the only route.
#
# After both tracks, every ~/.fontist/*index*.yml is removed so the compile
# re-globs the complete font tree instead of adopting a partial burst index
# (the fontist/fontist#554 race the packed-mn release gate documents).
fonts:
  install:
    - STIX Two Math
    - Source Serif Pro
    - Source Code Pro
  statics:
    - url: https://fonts.gstatic.com/s/opensans/v44/memSYaGs126MiZpBA-UvWbX2vVnXBbObj2OVZyOOSr4dVJWUgsiH0C4nY1M2xLER.ttf
